# Quant Opportunity Engine — Default Configuration
# =================================================
# Environment variables OVERRIDE these values.
# This file defines safe defaults.

# Quant Opportunity Engine — FINAL V1.0 POLICY CONFIGURATION
# ==========================================================
#
# MARKET:               SPOT ONLY — no leverage/margin/futures/shorts
# STOP LOSS:            -0.30% HARD STOP
# TAKE PROFIT:          NONE — no fixed profit ceiling
# PROFIT MANAGEMENT:    Trailing stop only
# TRADE COUNT:          Opportunity-driven, no fixed daily count
# CAPITAL:              Dynamic, liquidity-aware allocation
# CAPITAL RECYCLING:    Immediate after position exit
#
# LIVE TRADING:         DISABLED BY DEFAULT

# --- Mode (MUST be "paper" for safety) ---
mode: paper
live_trading_enabled: false

# --- Database ---
database:
  pool_size: 20
  pool_overflow: 10
  echo: false

# --- Risk (FINAL POLICY V1.0) ---
# SPOT ONLY — no leverage, margin, futures, short selling
risk:
  max_position_size_usd: 1000.0
  max_total_exposure_usd: 10000.0
  max_drawdown_pct: 10.0
  default_stop_loss_pct: 0.30            # FINAL: -0.30% HARD STOP
  max_leverage: 1.0                       # SPOT ONLY: 1.0x
  max_positions_per_strategy: 10
  max_correlated_exposure_pct: 25.0
  circuit_breaker_drawdown_pct: 15.0
  circuit_breaker_consecutive_losses: 5
  # Trailing stop
  trail_pct: 0.20                         # Distance from peak (0.20% — FINAL)
  trail_activation_pct: 0.20              # Profit to activate (0.20% — FINAL)
  enable_fixed_take_profit: false         # ALWAYS false

# --- Opportunity Engine ---
opportunity:
  min_confidence: 0.5
  min_net_return: 0.001  # R7: decimal fraction (was min_net_return_pct)
  min_fill_probability: 0.5
  max_correlation: 0.7

# --- Paper execution / re-entry / churn protection ---
# Environment variables shown in comments override these model defaults.
paper:
  loss_cooldown_seconds: 300.0             # LOSS_COOLDOWN_SECONDS; each net loss
  win_cooldown_seconds: 30.0               # WIN_COOLDOWN_SECONDS; shorter than loss
  trail_activation_pct: 0.20               # TRAIL_ACTIVATION_PCT; configured floor
  trail_distance_pct: 0.20                 # TRAIL_DISTANCE_PCT; configured floor
  # The trail is widened per position from live volatility/spread, never
  # tightened below the floor and never converted into a fixed take-profit.
  trail_volatility_multiplier: 1.50        # TRAIL_VOLATILITY_MULTIPLIER
  trail_spread_multiplier: 2.00            # TRAIL_SPREAD_MULTIPLIER
  trail_activation_volatility_multiplier: 1.25 # TRAIL_ACTIVATION_VOLATILITY_MULTIPLIER
  max_trail_distance_pct: 1.25             # MAX_TRAIL_DISTANCE_PCT
  # A winning trail may re-enter early only after a new, materially stronger,
  # structurally aligned sequence. Hard-stop cooldowns are never bypassed.
  material_reentry_confidence_improvement: 0.10 # MATERIAL_REENTRY_CONFIDENCE_IMPROVEMENT
  min_reentry_market_structure_score: 0.55  # MIN_REENTRY_MARKET_STRUCTURE_SCORE
  reentry_reference_volatility_pct: 0.30    # REENTRY_REFERENCE_VOLATILITY_PCT
  # Runtime activation is raised above the floor when required so the trail
  # level covers estimated fees/spread/slippage instead of protecting a net loss.
  max_consecutive_losses_per_symbol: 2     # MAX_CONSECUTIVE_LOSSES_PER_SYMBOL
  symbol_lockout_seconds: 1800.0            # SYMBOL_LOCKOUT_SECONDS; temporary
  symbol_loss_streak_reset_seconds: 21600.0 # SYMBOL_LOSS_STREAK_RESET_SECONDS
  min_expected_edge_over_cost: 0.001        # MIN_EXPECTED_EDGE_OVER_COST (10 bps)
  taker_fee: 0.001                          # PAPER_TAKER_FEE (0.10% each fill)
  maker_fee: 0.001                          # PAPER_MAKER_FEE
  slippage_bps: 5.0                        # PAPER_SLIPPAGE_BPS each fill
  simulated_latency_ms: 50.0               # PAPER_SIMULATED_LATENCY_MS

# --- Execution ---
execution:
  max_retries: 3
  order_timeout_seconds: 30.0
  simulated_latency_ms: 50.0  # Paper only

# --- Backtesting ---
backtesting:
  maker_fee: 0.001
  taker_fee: 0.001
  slippage_bps: 5.0
  latency_ms: 100.0
  initial_capital: 10000.0
  train_window_days: 90
  test_window_days: 30

# --- Data ---
data:
  stale_threshold_seconds: 10.0
  reconnect_base_delay: 1.0
  reconnect_max_delay: 30.0

# --- Logging ---
logging:
  level: INFO
  format: json  # "json" or "text"

# --- Dashboard ---
dashboard:
  host: "0.0.0.0"
  port: 8080
